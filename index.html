<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Mill Admin Demo</title>
<style>
:root{--g:#16845d;--gs:#eaf6ef;--n:#172b4d;--ink:#26364b;--m:#758399;--l:#e6ebf1;--bg:#f5f7fa;--red:#c94b4b;--amber:#c98725}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.side{position:fixed;inset:0 auto 0 0;width:235px;background:#14243d;color:#dce6f1;padding:22px 14px;display:flex;flex-direction:column}.brand{font-size:18px;font-weight:bold;color:white;padding:8px 10px 30px}.brand i{display:inline-grid;place-items:center;background:#1a9669;width:35px;height:35px;border-radius:10px;margin-right:8px;font-style:normal}.navtitle{font-size:10px;color:#8294aa;text-transform:uppercase;padding:10px}.nav button{width:100%;border:0;background:transparent;color:#b8c6d6;text-align:left;padding:12px;border-radius:8px;cursor:pointer;margin:2px 0}.nav button.active,.nav button:hover{background:#213b5b;color:white}.foot{margin-top:auto;border-top:1px solid #2b405b;padding:14px 8px;color:#91a3b9;font-size:10px}.main{margin-left:235px}.top{height:68px;background:white;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;padding:0 28px;color:var(--m);font-size:12px}.content{padding:28px;max-width:1400px;margin:auto}h1{font-size:24px;color:var(--n);margin:0 0 6px}.sub{color:var(--m);font-size:12px}.head{display:flex;justify-content:space-between;gap:12px;margin-bottom:22px}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:16px}.card{background:white;border:1px solid var(--l);border-radius:12px;padding:17px;box-shadow:0 6px 20px #1b35500a}.statlabel{font-size:11px;color:var(--m)}.num{font-size:27px;color:var(--n);font-weight:bold;margin:9px 0 4px}.note{font-size:10px;color:var(--g)}.cols{grid-template-columns:1.2fr 1fr}.btn{border:1px solid var(--l);background:white;padding:8px 11px;border-radius:8px;font-size:11px;cursor:pointer}.primary{background:var(--g);color:white;border-color:var(--g)}.danger{color:var(--red)}.small{padding:6px 8px}.tablecard{padding:0;overflow:hidden}.tablehead{display:flex;justify-content:space-between;align-items:center;padding:16px;gap:10px}.tablehead b{color:var(--n)}.search,select{border:1px solid var(--l);padding:8px;border-radius:7px;font-size:11px}table{width:100%;border-collapse:collapse}th{text-align:left;background:#f8fafc;color:#8490a1;font-size:10px;text-transform:uppercase;padding:12px}td{padding:13px 12px;border-top:1px solid #edf0f4;font-size:12px}td strong{color:var(--n)}td small{display:block;color:var(--m);font-size:10px;margin-top:3px}.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:var(--gs);color:var(--g);font-size:10px;font-weight:bold}.pending{background:#fff5e7;color:var(--amber)}.rejected{background:#fff0f0;color:var(--red)}.actions{display:flex;gap:5px;flex-wrap:wrap}.notice{margin-top:15px;padding:13px;background:#f1faf5;border:1px solid #dcefe5;border-radius:9px;color:#386d55;font-size:11px;line-height:1.6}.steps{grid-template-columns:repeat(3,1fr)}.step{border:1px solid var(--l);border-radius:10px;padding:15px}.step b{color:var(--n);font-size:12px}.step p{font-size:10px;color:var(--m);line-height:1.5}.field{margin:12px 0}.field label{display:block;font-size:11px;color:var(--m);margin-bottom:6px}.field input,.field select{width:100%;padding:10px}.profile{grid-template-columns:230px 1fr}.center{text-align:center}.bubble{margin:5px auto 12px;width:65px;height:65px;border-radius:50%;display:grid;place-items:center;background:var(--gs);color:var(--g);font-size:22px;font-weight:bold}.modalbg{display:none;position:fixed;inset:0;background:#10243b77;align-items:center;justify-content:center;padding:15px}.modalbg.show{display:flex}.modal{background:white;padding:22px;border-radius:13px;width:min(400px,100%)}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;bottom:20px;right:20px;background:#18334e;color:white;padding:12px 15px;border-radius:8px;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}@media(max-width:650px){.side{width:60px;padding:12px 6px}.brand{font-size:0;padding:5px}.brand i{margin:0}.navtitle,.nav button span,.foot{display:none}.nav button{text-align:center;padding:12px 5px;font-size:0}.nav button:after{content:attr(data-short);font-size:12px}.main{margin-left:60px}.content{padding:18px 12px}.top{padding:0 12px}.head{flex-direction:column}.steps,.profile{grid-template-columns:1fr}.tablecard{overflow-x:auto}.tablecard table{min-width:680px}}@media(max-width:400px){.stats{grid-template-columns:1fr}}
</style></head><body>
<aside class="side"><div class="brand"><i>S</i><span>SMART MILL</span></div><div class="navtitle">Administration</div><nav class="nav">
<button class="active" data-p="dashboard" data-short="▦">▦　Dashboard</button><button data-p="approvals" data-short="♙">♙　User Approval</button><button data-p="assignment" data-short="⌁">⌁　Gateway Assignment</button><button data-p="connections" data-short="⇄">⇄　Connections</button></nav><div class="navtitle">Account</div><nav class="nav"><button data-p="profile" data-short="◉">◉　Profile</button><button id="logout" data-short="↪">↪　Logout</button></nav><div class="foot">Admin Portal · Demo data</div></aside>
<main class="main"><header class="top"><span>Smart Mill / <b id="crumb">Dashboard</b></span><span>● ADMIN SESSION　　<b>AD</b></span></header><section class="content" id="screen"></section></main>
<div class="modalbg" id="modal"><div class="modal"><h3 id="mtitle">Confirm</h3><p class="sub" id="mbody">Confirm this action?</p><div class="modalactions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="mconfirm">Confirm</button></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);let users=[{id:'USR-1001',name:'Arun Kumar',email:'arun@mill.com',status:'Approved',date:'05 Nov 2026'},{id:'USR-1002',name:'Priya S',email:'priya@mill.com',status:'Pending',date:'06 Nov 2026'},{id:'USR-1003',name:'Karthik R',email:'karthik@mill.com',status:'Pending',date:'06 Nov 2026'},{id:'USR-1004',name:'Meena V',email:'meena@mill.com',status:'Rejected',date:'04 Nov 2026'},{id:'USR-1005',name:'Vijay M',email:'vijay@mill.com',status:'Approved',date:'02 Nov 2026'}];
let gateways=[{id:'GW-1001',serial:'SN-A1001',status:'Available'},{id:'GW-1002',serial:'SN-A1002',status:'Assigned'},{id:'GW-1003',serial:'SN-A1003',status:'Available'},{id:'GW-1004',serial:'SN-A1004',status:'Assigned'}];
let links=[{id:'ASN-001',user:'Arun Kumar',gateway:'GW-1002',date:'05 Nov 2026',state:'Connected'},{id:'ASN-002',user:'Vijay M',gateway:'GW-1004',date:'03 Nov 2026',state:'Disconnected'}];let action=null;
function toast(x){$('#toast').textContent=x;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function pill(x){return `<span class="pill ${x==='Pending'||x==='Disconnected'?'pending':x==='Rejected'?'rejected':''}">${x}</span>`}
function stat(a,b,c){return `<div class="card"><div class="statlabel">${a}</div><div class="num">${b}</div><div class="note">${c}</div></div>`}
function table(h,r){return `<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r}</tbody></table>`}
function head(a,b,button=''){return `<div class="head"><div><h1>${a}</h1><div class="sub">${b}</div></div>${button}</div>`}
function dashboard(){return head('Admin Dashboard','Manage user approvals and gateway connections')+`<div class="grid stats">${stat('Pending Approvals',users.filter(u=>u.status==='Pending').length,'Awaiting review')}${stat('Approved Users',users.filter(u=>u.status==='Approved').length,'Eligible for assignment')}${stat('Registered Gateways',gateways.length,'Gateway inventory')}${stat('Active Connections',links.filter(x=>x.state==='Connected').length,'Connected user-gateway pairs')}</div><div class="grid cols"><div class="card"><div class="tablehead" style="padding:0 0 15px"><b>Admin responsibilities</b></div><div class="grid steps"><div class="step"><b>1. Approve users</b><p>Review registrations and approve or reject access.</p><button class="btn small" onclick="go('approvals')">Open</button></div><div class="step"><b>2. Assign gateways</b><p>Allocate an available gateway to an approved user.</p><button class="btn small" onclick="go('assignment')">Open</button></div><div class="step"><b>3. Manage connections</b><p>Connect or disconnect assigned users.</p><button class="btn small" onclick="go('connections')">Open</button></div></div></div><div class="card"><b style="color:var(--n);font-size:13px">Gateway availability</b>${gateways.map(g=>`<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--l);font-size:12px"><b>${g.id}</b>${pill(g.status)}</div>`).join('')}</div></div><div class="notice"><b>Admin scope:</b> User approval, gateway assignment, and user-gateway connection management only. Machines, Alerts, and Reports are excluded.</div>`}
function approvals(){return head('User Approval','Review registration requests and manage user approval status')+`<div class="card tablecard"><div class="tablehead"><b>Registration Requests</b><input class="search" placeholder="Search users..." oninput="search(this)"></div><div id="approvalTable">${table(['User ID','User details','Registered','Status','Action'],users.map((u,i)=>`<tr><td><b>${u.id}</b></td><td><strong>${u.name}</strong><small>${u.email}</small></td><td>${u.date}</td><td>${pill(u.status)}</td><td class="actions">${u.status==='Pending'?`<button class="btn primary small" onclick="approve(${i})">Approve</button><button class="btn danger small" onclick="reject(${i})">Reject</button>`:`<button class="btn small" onclick="toast('${u.name}: ${u.status}')">View</button>`}</td></tr>`).join(''))}</div></div><div class="notice">Only approved users can be assigned to gateways.</div>`}
function assignment(){let ok=users.filter(u=>u.status==='Approved'),free=gateways.filter(g=>g.status==='Available');return head('Gateway Assignment','Assign an available gateway to an approved user')+`<div class="grid cols"><div class="card"><b style="color:var(--n)">New assignment</b><div class="field"><label>Approved user</label><select id="au">${ok.map(u=>`<option value="${u.id}">${u.name} · ${u.id}</option>`).join('')}</select></div><div class="field"><label>Available gateway</label><select id="ag">${free.map(g=>`<option value="${g.id}">${g.id} · ${g.serial}</option>`).join('')}</select></div><button class="btn primary" onclick="assign()">Assign Gateway</button><p class="sub">Only approved users and available gateways are selectable.</p></div><div class="card"><b style="color:var(--n)">Assignment rules</b><p class="sub">• One gateway has one active user assignment at a time.</p><p class="sub">• One user may have multiple gateways.</p><p class="sub">• Disconnect before reassignment.</p><p class="sub">• Keep assignment history.</p></div></div><div class="card tablecard" style="margin-top:16px"><div class="tablehead"><b>Assignment history</b></div>${table(['Assignment','User','Gateway','Date','Connection'],links.map(x=>`<tr><td>${x.id}</td><td>${x.user}</td><td>${x.gateway}</td><td>${x.date}</td><td>${pill(x.state)}</td></tr>`).join(''))}</div>`}
function connections(){return head('Connections','Connect or disconnect users from their assigned gateways')+`<div class="card tablecard"><div class="tablehead"><b>User-gateway connections</b><input class="search" placeholder="Search connections..." oninput="search(this)"></div>${table(['Assignment','User','Gateway','Assigned date','Status','Action'],links.map((x,i)=>`<tr><td>${x.id}</td><td><b>${x.user}</b></td><td>${x.gateway}</td><td>${x.date}</td><td>${pill(x.state)}</td><td>${x.state==='Connected'?`<button class="btn danger small" onclick="disconnect(${i})">Disconnect</button>`:`<button class="btn primary small" onclick="connect(${i})">Connect</button>`}</td></tr>`).join(''))}</div><div class="notice">Disconnecting releases the gateway for future reassignment. The assignment remains in history.</div>`}
function profile(){return head('Admin Profile','Administrator account information')+`<div class="grid profile"><div class="card center"><div class="bubble">AD</div><b>Smart Mill Admin</b><p class="sub">System Administrator</p>${pill('Active')}</div><div class="card"><div class="tablehead" style="padding:0 0 15px"><b>Account details</b><button class="btn primary small" onclick="toast('Profile saved in demo mode')">Save</button></div><div class="field"><label>Full name</label><input value="Smart Mill Admin"></div><div class="field"><label>Email</label><input value="admin@smartmill.com"></div><div class="field"><label>Role</label><input value="Administrator" disabled></div></div></div>`}
const pages={dashboard,approvals,assignment,connections,profile};function go(p){document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));$('#crumb').textContent=({dashboard:'Dashboard',approvals:'User Approval',assignment:'Gateway Assignment',connections:'Connections',profile:'Profile'})[p];$('#screen').innerHTML=pages[p]()}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));
function approve(i){users[i].status='Approved';go('approvals');toast('User approved')}
function reject(i){confirm('Reject this registration?')&&(users[i].status='Rejected',go('approvals'),toast('Registration rejected'))}
function assign(){let uid=$('#au')?.value,gid=$('#ag')?.value,u=users.find(x=>x.id===uid),g=gateways.find(x=>x.id===gid);if(!u||!g||u.status!=='Approved'||g.status!=='Available'){toast('Select an approved user and available gateway');return}links.unshift({id:'ASN-'+String(links.length+1).padStart(3,'0'),user:u.name,gateway:g.id,date:'Today',state:'Disconnected'});g.status='Assigned';go('assignment');toast('Gateway assigned')}
function confirmBox(msg,fn){$('#mtitle').textContent=msg;$('#mbody').textContent='Please confirm this action.';action=fn;$('#mconfirm').onclick=()=>{$('#modal').classList.remove('show');let f=action;action=null;f()};$('#modal').classList.add('show')}
function disconnect(i){confirmBox('Disconnect user?',()=>{links[i].state='Disconnected';let g=gateways.find(x=>x.id===links[i].gateway);if(g)g.status='Available';go('connections');toast('Disconnected; gateway available')})}
function connect(i){confirmBox('Connect user?',()=>{if(links.some((x,j)=>j!==i&&x.gateway===links[i].gateway&&x.state==='Connected')){toast('Gateway already connected to another user');return}links[i].state='Connected';let g=gateways.find(x=>x.id===links[i].gateway);if(g)g.status='Assigned';go('connections');toast('User connected')})}
function closeModal(){$('#modal').classList.remove('show')}
function search(el){let q=el.value.toLowerCase(),tb=el.closest('.card').querySelector('tbody');if(tb)tb.querySelectorAll('tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
$('#logout').onclick=()=>toast('Demo logout selected');go('dashboard');
</script></body></html>
